# Include these locations INSIDE your existing, approved HTTPS server {}.
# Do not deploy this as a standalone Nginx configuration or create a new ALB/target group.
# Match the existing authentication and access-control policy on BOTH locations.
# Keeping proxy_pass free of a URI suffix preserves the original request path.
location = /dashboard { return 302 /dashboard/; }
location ^~ /dashboard/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
}
location ^~ /api/demo/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 2s;
    proxy_read_timeout 20s;
}
