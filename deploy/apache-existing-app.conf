# Illustrative directives INSIDE the existing HTTPS <VirtualHost *:443>.
# Browser -> ALB:443 -> existing EC2 TLS web server:443; proxy locally to Node:8787.
# Preserve the existing authentication and access rules for these paths.
# Requires existing mod_proxy / mod_proxy_http; creates no AWS resources.
ProxyPass        "/dashboard/" "http://127.0.0.1:8787/dashboard/"
ProxyPassReverse "/dashboard/" "http://127.0.0.1:8787/dashboard/"
ProxyPass        "/api/demo/" "http://127.0.0.1:8787/api/demo/"
ProxyPassReverse "/api/demo/" "http://127.0.0.1:8787/api/demo/"
